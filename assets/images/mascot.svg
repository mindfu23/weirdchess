<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9B8A"/>
      <stop offset="1" stop-color="#FF8C42"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="48" height="48" rx="12"/>
    </clipPath>
  </defs>

  <!-- Background rounded square -->
  <rect width="48" height="48" rx="12" fill="url(#bg)"/>

  <g clip-path="url(#clip)">
    <!-- Crown base bar -->
    <rect x="12" y="20" width="24" height="4" rx="1.5" fill="#1A1A1A"/>
    <!-- Crown left prong -->
    <rect x="13" y="14" width="4" height="8" rx="2" fill="#1A1A1A"/>
    <!-- Crown centre prong (tallest) -->
    <rect x="22" y="10" width="4" height="12" rx="2" fill="#1A1A1A"/>
    <!-- Crown right prong -->
    <rect x="31" y="14" width="4" height="8" rx="2" fill="#1A1A1A"/>

    <!-- Face circle -->
    <circle cx="24" cy="36" r="13" fill="#1A1A1A"/>

    <!-- Eyes -->
    <circle cx="20" cy="34" r="2" fill="#FF8C42"/>
    <circle cx="28" cy="34" r="2" fill="#FF8C42"/>

    <!-- Smile -->
    <path d="M19 38 Q24 43 29 38" stroke="#FF8C42" stroke-width="2"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>
