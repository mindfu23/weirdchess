[build]
  publish = "build/web"
  command = "bash scripts/build-web.sh"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "APP_SECRET_TOKEN"

# Redirects for SPA routing (exclude static assets and functions)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for CORS
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"

# Development settings
[dev]
  publish = "build/web"
  port = 8888
  autoLaunch = true
