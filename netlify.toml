[build]
  publish = "build/web"
  command = "bash scripts/build-web.sh"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "APP_SECRET_TOKEN"

# Missing assets should 404, not fall through to the SPA redirect.
# Otherwise rootBundle.load() on web gets index.html back with status 200
# and flutter_svg throws "Invalid SVG data".
#
# `to` is REQUIRED. Without it Netlify rejects the rule with
# `Missing "to" field` and silently drops it — which is how this sat broken:
# the comment above described a fix that was never in effect.
# A non-forced redirect is shadowed by a real file, so assets that exist are
# still served normally and only missing ones reach this rule.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# Health endpoint — must precede the SPA catch-all, otherwise /api/health
# falls through to index.html and returns 200 with HTML, which reads as "up"
# to a plain uptime monitor while every real check is silently skipped.
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

# Redirects for SPA routing (exclude static assets and functions)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for CORS
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"

# Development settings
[dev]
  publish = "build/web"
  port = 8888
  autoLaunch = true
